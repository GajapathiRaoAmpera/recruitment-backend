[project]
name = "recruitment-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.4",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Judge0 (`make judge0-up`); run them with `make test-judge0`
addopts = "-m 'not integration'"
markers = ["integration: needs a running Judge0; skipped by default"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style puts these calls in argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.security.require_role"]
